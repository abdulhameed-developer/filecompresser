name: Validate reviewed FileCompresser source

# READ-ONLY TEMPLATE: publish the reviewed source first, render its commit SHA,
# then add this workflow in a child commit on the integration branch only.
on:
  push:
    branches: [work/filecompresser-production-20261121]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filecompresser-reviewed-source-validation
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: b1a604d27c39da1e8f4422c576816a3ee23d0c78
  INTEGRATION_BRANCH: work/filecompresser-production-20261121
  NEXT_PUBLIC_SITE_URL: https://filecompresser.com
  NEXT_PUBLIC_ENABLE_INDEXING: 'false'
  NEXT_PUBLIC_TINA_CLIENT_ID: e80a2716-65ae-4124-a250-85a481310f9a
  NEXT_PUBLIC_TINA_BRANCH: work/filecompresser-production-20261121

jobs:
  validate:
    if: >-
      github.repository == 'abdulhameed-developer/filecompresser' &&
      github.ref == 'refs/heads/work/filecompresser-production-20261121' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - name: Verify the reviewed source before executing project code
        shell: bash
        run: |
          set -euo pipefail
          export VALIDATION_EVIDENCE="$RUNNER_TEMP/filecompresser-validation-evidence"
          printf 'VALIDATION_EVIDENCE=%s\n' "$VALIDATION_EVIDENCE" >> "$GITHUB_ENV"
          [[ "$GITHUB_REPOSITORY" == 'abdulhameed-developer/filecompresser' ]]
          [[ "$GITHUB_REF" == "refs/heads/$INTEGRATION_BRANCH" ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" HEAD
          [[ ! -e .delivery/source.bundle && ! -e .github/workflows/ingest-prepared-source.yml ]]
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import assert from 'node:assert/strict'
          const allowed = new Set(['.github/workflows/validate-prepared-source.yml', 'package.json', 'package-lock.json', 'tina/tina-lock.json'])
          const changed = execFileSync('git', ['diff', '--name-only', '-z', process.env.EXPECTED_SOURCE_SHA, 'HEAD']).toString('utf8').split('\0').filter(Boolean)
          assert.ok(changed.every(name => allowed.has(name)), 'Current HEAD differs from reviewed source outside the validator and generated locks.')
          const reviewed = JSON.parse(execFileSync('git', ['show', `${process.env.EXPECTED_SOURCE_SHA}:package.json`], { encoding: 'utf8' }))
          const current = JSON.parse(readFileSync('package.json', 'utf8'))
          const withCms = structuredClone(reviewed)
          withCms.devDependencies = { ...withCms.devDependencies, tinacms: '3.15.2', '@tinacms/cli': '4.0.5' }
          try { assert.deepEqual(current, reviewed) } catch { assert.deepEqual(current, withCms) }
          NODE
          git ls-files -z --cached --others --exclude-standard | node scripts/check-source-secrets.mjs --files-stdin
          mkdir -p "$VALIDATION_EVIDENCE"
      - name: Install the source lockfile and exact CMS releases
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run setup:cms
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(pkg.devDependencies.tinacms, '3.15.2')
          assert.equal(pkg.devDependencies['@tinacms/cli'], '4.0.5')
          assert.equal(JSON.parse(readFileSync('node_modules/tinacms/package.json', 'utf8')).version, '3.15.2')
          assert.equal(JSON.parse(readFileSync('node_modules/@tinacms/cli/package.json', 'utf8')).version, '4.0.5')
          NODE
      - name: Report high-severity dependency advisory paths
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --json > "$VALIDATION_EVIDENCE/diagnostic-audit-all.json"
          set -e
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'
          const audit = JSON.parse(readFileSync(path.join(process.env.VALIDATION_EVIDENCE, 'diagnostic-audit-all.json'), 'utf8'))
          if (audit.error || !audit.metadata?.vulnerabilities) throw Error('Dependency diagnostic did not receive a usable npm audit report.')
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          const packages = lock.packages || {}
          const advisories = Object.entries(audit.vulnerabilities || {})
            .filter(([, value]) => value.severity === 'high' || value.severity === 'critical')
            .map(([name, value]) => ({
              name, severity: value.severity, isDirect: value.isDirect, range: value.range,
              via: value.via, effects: value.effects, fixAvailable: value.fixAvailable,
              nodes: (value.nodes || []).map(node => ({ path: node, version: packages[node]?.version, dev: packages[node]?.dev === true })),
              requiredBy: Object.entries(packages).flatMap(([node, metadata]) => {
                const dependencies = { ...metadata.dependencies, ...metadata.devDependencies, ...metadata.optionalDependencies }
                return Object.hasOwn(dependencies, name) ? [{ path: node || '(root)', version: metadata.version, range: dependencies[name], dev: metadata.dev === true }] : []
              }),
            }))
          console.log('DEPENDENCY_DIAGNOSTIC_BEGIN')
          console.log(JSON.stringify({ vulnerabilities: audit.metadata.vulnerabilities, advisories }))
          console.log('DEPENDENCY_DIAGNOSTIC_END')
          NODE
      - name: Validate types, lint and tests
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm test
      - name: Generate local CMS schema, lockfile and static test build
        run: |
          set -euo pipefail
          npm run build:cms:local
          npm run check:public
          npm run check:export
          node scripts/package-site.mjs
          git ls-files -z --cached --others --exclude-standard | node scripts/check-source-secrets.mjs --files-stdin
      - name: Install isolated, pinned browser and decoder QA tools
        shell: bash
        run: |
          set -euo pipefail
          QA_TOOLS_DIR="$RUNNER_TEMP/filecompresser-pwtools"
          mkdir -p "$QA_TOOLS_DIR"
          npm install --prefix "$QA_TOOLS_DIR" --no-save --no-package-lock --no-fund --audit=false playwright-core@1.64.1 omggif@1.0.10 ffmpeg-static@5.3.0 ffprobe-static@3.1.0 2>&1 | tee "$VALIDATION_EVIDENCE/qa-tools-install.log"
          QA_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$QA_CHROME" && -x "$QA_CHROME" ]] || { echo 'Official runner Chrome/Chromium is unavailable; browser QA is required.' >&2; exit 1; }
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          command -v pdftotext >/dev/null
          printf 'PW_TOOLS=%s\nCHROME_PATH=%s\n' "$QA_TOOLS_DIR" "$QA_CHROME" >> "$GITHUB_ENV"
      - name: Exercise the tested static export in isolated Chrome
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          QA_BASE='http://127.0.0.1:3198'
          if curl --silent --output /dev/null --max-time 2 "$QA_BASE/"; then
            echo 'QA port 3198 is occupied. No existing process was stopped.' >&2
            exit 1
          fi
          PREVIEW_HOST=127.0.0.1 PORT=3198 node scripts/serve-static.mjs > "$VALIDATION_EVIDENCE/qa-preview.log" 2>&1 &
          QA_SERVER_PID=$!
          cleanup() { kill "$QA_SERVER_PID" 2>/dev/null || true; wait "$QA_SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          QA_READY=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --output /dev/null --max-time 2 "$QA_BASE/"; then QA_READY=1; break; fi
            if ! kill -0 "$QA_SERVER_PID" 2>/dev/null; then cat "$VALIDATION_EVIDENCE/qa-preview.log"; exit 1; fi
            sleep 0.5
          done
          [[ "$QA_READY" -eq 1 ]] || { cat "$VALIDATION_EVIDENCE/qa-preview.log"; echo 'Owned QA server did not become ready.' >&2; exit 1; }
          QA_FAILED=0
          set +e
          timeout 180s node scripts/route-crawl.mjs "$QA_BASE" 2>&1 | tee "$VALIDATION_EVIDENCE/qa-route-crawl.log"
          QA_PIPE=("${PIPESTATUS[@]}")
          QA_STATUS=${QA_PIPE[0]}
          [[ "${QA_PIPE[1]}" -eq 0 ]] || QA_STATUS=125
          set -e
          printf 'route-crawl\t%s\n' "$QA_STATUS" > "$VALIDATION_EVIDENCE/qa-status.tsv"
          [[ "$QA_STATUS" -eq 0 ]] || QA_FAILED=1
          for audit in navigation responsive role a11y-manual design-system premium-ui functionality; do
            QA_LIMIT=300s
            [[ "$audit" != 'functionality' ]] || QA_LIMIT=900s
            set +e
            TEST_BROWSER=chromium timeout "$QA_LIMIT" node "scripts/${audit}-audit.mjs" "$QA_BASE" 2>&1 | tee "$VALIDATION_EVIDENCE/qa-${audit}.log"
            QA_PIPE=("${PIPESTATUS[@]}")
            QA_STATUS=${QA_PIPE[0]}
            [[ "${QA_PIPE[1]}" -eq 0 ]] || QA_STATUS=125
            set -e
            printf '%s\t%s\n' "$audit" "$QA_STATUS" >> "$VALIDATION_EVIDENCE/qa-status.tsv"
            [[ "$QA_STATUS" -eq 0 ]] || QA_FAILED=1
          done
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import path from 'node:path'
          const directory = process.env.VALIDATION_EVIDENCE
          const checks = readFileSync(path.join(directory, 'qa-status.tsv'), 'utf8').trim().split('\n').map(line => {
            const [audit, code] = line.split('\t')
            return { audit, exitCode: Number(code), passed: code === '0' }
          })
          writeFileSync(path.join(directory, 'qa-status.json'), JSON.stringify({
            browser: 'isolated runner Chrome/Chromium', tests: checks,
            coverage: 'public static UI and genuine generated/downloaded file outputs',
            hostedCmsAuthenticationTested: false, productionDeploymentTested: false,
          }, null, 2))
          NODE
          npm run check:public
          [[ "$QA_FAILED" -eq 0 ]] || { echo 'One or more required browser/output audits failed. Validation has failed; downloaded locks must not be committed.' >&2; exit 1; }
      - name: Audit production and development dependencies
        shell: bash
        run: |
          set +e
          npm audit --json > "$VALIDATION_EVIDENCE/audit-all.json"
          npm audit --omit=dev --json > "$VALIDATION_EVIDENCE/audit-production.json"
          set -e
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'
          const read = name => JSON.parse(readFileSync(path.join(process.env.VALIDATION_EVIDENCE, name), 'utf8'))
          const all = read('audit-all.json')
          const production = read('audit-production.json')
          if (all.error || production.error || !all.metadata?.vulnerabilities || !production.metadata?.vulnerabilities) throw Error('Audit service did not return usable reports.')
          const a = all.metadata.vulnerabilities
          const p = production.metadata.vulnerabilities
          console.log(`Dependency audit: production total=${p.total}; all high=${a.high}, critical=${a.critical}, moderate=${a.moderate}, low=${a.low}.`)
          if (p.total || a.high || a.critical) throw Error('Dependency audit gate failed; review compatible fixes without force upgrades.')
          NODE
      - name: Record only tested source lock metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { copyFileSync, lstatSync, readFileSync, writeFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import assert from 'node:assert/strict'
          import path from 'node:path'
          const files = ['package.json', 'package-lock.json', 'tina/tina-lock.json']
          const expected = JSON.parse(execFileSync('git', ['show', `${process.env.EXPECTED_SOURCE_SHA}:package.json`], { encoding: 'utf8' }))
          expected.devDependencies = { ...expected.devDependencies, tinacms: '3.15.2', '@tinacms/cli': '4.0.5' }
          assert.deepEqual(JSON.parse(readFileSync('package.json', 'utf8')), expected)
          for (const args of [['diff', '--name-only', '-z'], ['ls-files', '--others', '--exclude-standard', '-z']]) {
            const changed = execFileSync('git', args).toString('utf8').split('\0').filter(Boolean)
            assert.ok(changed.every(name => files.includes(name)), 'Build modified an unexpected source file.')
          }
          const hashes = {}
          for (const [index, file] of files.entries()) {
            assert.ok(lstatSync(file).isFile() && !lstatSync(file).isSymbolicLink())
            const bytes = readFileSync(file)
            JSON.parse(bytes.toString('utf8'))
            hashes[file] = createHash('sha256').update(bytes).digest('hex')
            copyFileSync(file, path.join(process.env.VALIDATION_EVIDENCE, `lock-${index}.json`))
          }
          writeFileSync(path.join(process.env.VALIDATION_EVIDENCE, 'validation.json'), JSON.stringify({
            approvedSource: process.env.EXPECTED_SOURCE_SHA, validatedHead: process.env.GITHUB_SHA,
            approvedSourceTree: execFileSync('git', ['rev-parse', `${process.env.EXPECTED_SOURCE_SHA}^{tree}`], { encoding: 'utf8' }).trim(),
            validatedHeadTree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            repository: process.env.GITHUB_REPOSITORY, branch: process.env.INTEGRATION_BRANCH, runId: process.env.GITHUB_RUN_ID,
            files: hashes, checked: true, cmsMode: 'local', browserQaPassed: true, repositoryWritesPerformed: false, deployableArtifactPublished: false,
          }, null, 2))
          NODE
      - name: Retain source locks and audit metadata only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-source-locks-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/filecompresser-validation-evidence/lock-0.json
            ${{ runner.temp }}/filecompresser-validation-evidence/lock-1.json
            ${{ runner.temp }}/filecompresser-validation-evidence/lock-2.json
            ${{ runner.temp }}/filecompresser-validation-evidence/validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain audit reports even if their gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/filecompresser-validation-evidence/audit-all.json
            ${{ runner.temp }}/filecompresser-validation-evidence/audit-production.json
          if-no-files-found: warn
          retention-days: 7
      - name: Collect only QA JSON, screenshots and logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { copyFileSync, existsSync, lstatSync, mkdirSync, readdirSync, readFileSync } from 'node:fs'
          import path from 'node:path'
          const evidence = process.env.VALIDATION_EVIDENCE
          const output = path.join(evidence, 'qa-evidence')
          mkdirSync(output, { recursive: true })
          const copy = (source, name, kind) => {
            if (!existsSync(source)) return
            const info = lstatSync(source)
            if (!info.isFile() || info.isSymbolicLink() || info.size > 10 * 1024 * 1024) throw Error('Unexpected QA evidence file type or size.')
            const bytes = readFileSync(source)
            if (kind === 'json') JSON.parse(bytes.toString('utf8'))
            if (kind === 'png' && !bytes.subarray(0, 8).equals(Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]))) throw Error('Invalid QA screenshot signature.')
            copyFileSync(source, path.join(output, name))
          }
          if (existsSync(evidence)) for (const entry of readdirSync(evidence)) {
            if (/^qa-[a-z-]+\.log$/.test(entry)) copy(path.join(evidence, entry), entry, 'log')
          }
          copy(path.join(evidence, 'qa-status.json'), 'qa-status.json', 'json')
          copy('.qa-results/functionality.json', 'functionality.json', 'json')
          if (existsSync('.qa-results')) for (const entry of readdirSync('.qa-results')) {
            if (/^failure-\d+\.png$/.test(entry)) copy(path.join('.qa-results', entry), entry, 'png')
          }
          for (const directory of ['design-system', 'premium']) {
            const source = path.join('.qa-results', directory)
            if (!existsSync(source)) continue
            for (const entry of readdirSync(source)) {
              if (entry === 'results.json') copy(path.join(source, entry), `${directory}-results.json`, 'json')
              if (/^[a-z-]+\.png$/.test(entry)) copy(path.join(source, entry), `${directory}-${entry}`, 'png')
            }
          }
          NODE
      - name: Retain public-site QA evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-site-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/filecompresser-validation-evidence/qa-evidence/
          if-no-files-found: warn
          retention-days: 7

name: Minimal known-source media core build

on:
  push:
    branches: [work/codec-source-rebuild-20261121]
    paths:
      - .github/workflows/codec-source-rebuild.yml
      - docs/codec-build/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: filecompresser-codec-source-probe
  cancel-in-progress: true

jobs:
  rebuild:
    if: >-
      github.repository == 'abdulhameed-developer/filecompresser' &&
      github.ref == 'refs/heads/work/codec-source-rebuild-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - name: Check the reviewed manifest and local script syntax
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'abdulhameed-developer/filecompresser' ]]
          [[ "$GITHUB_REF" == 'refs/heads/work/codec-source-rebuild-20261121' ]]
          node --check docs/codec-build/collect-sources.mjs
          node --check docs/codec-build/rebuild-probe.mjs
          node --check docs/codec-build/artifact-budget.mjs
          node docs/codec-build/collect-sources.mjs --validate-only
          git --version
          docker version
          docker buildx version
          python3 --version
      - name: Acquire verified source, build a new core and compare identity
        timeout-minutes: 170
        shell: bash
        run: |
          set -euo pipefail
          node docs/codec-build/rebuild-probe.mjs "$RUNNER_TEMP/filecompresser-codec-probe"
      - name: Verify patched complete package and cumulative retention budget
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node docs/codec-build/artifact-budget.mjs success "$RUNNER_TEMP/filecompresser-codec-probe"
      - name: Retain complete source with the newly built core for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codec-source-and-new-core-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/filecompresser-codec-probe/codec-source-and-new-core.tar.gz
            ${{ runner.temp }}/filecompresser-codec-probe/diagnostics/*.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Check cumulative budget for diagnostic-only failure retention
        if: failure()
        id: failure_budget
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node docs/codec-build/artifact-budget.mjs failure "$RUNNER_TEMP/filecompresser-codec-probe"
      - name: Retain small diagnostics only if the probe fails
        if: failure() && steps.failure_budget.outputs.retain_diagnostics == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codec-probe-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/filecompresser-codec-probe/diagnostics/*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Record the exact scope of this probe
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'Codec investigation only: pinned source acquisition, a newly compiled single-thread FFmpeg 5.1.10+19.b5d146d17cb4 engine and intentional old-npm difference comparison. No old installed codec binary is retained. Complete source and notices accompany any retained new binary. Main, the integration branch, DNS, website hosting and CMS accounts are not changed. No legal-clearance or production-readiness claim is made.' >> "$GITHUB_STEP_SUMMARY"

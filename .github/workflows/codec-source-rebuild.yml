name: Codec source and single-thread rebuild probe

on:
  push:
    branches: [work/codec-source-rebuild-20261121]
    paths:
      - .github/workflows/codec-source-rebuild.yml
      - docs/codec-build/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filecompresser-codec-source-probe
  cancel-in-progress: false

jobs:
  rebuild:
    if: >-
      github.repository == 'abdulhameed-developer/filecompresser' &&
      github.ref == 'refs/heads/work/codec-source-rebuild-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - name: Check the reviewed manifest and local script syntax
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'abdulhameed-developer/filecompresser' ]]
          [[ "$GITHUB_REF" == 'refs/heads/work/codec-source-rebuild-20261121' ]]
          node --check docs/codec-build/collect-sources.mjs
          node --check docs/codec-build/rebuild-probe.mjs
          node docs/codec-build/collect-sources.mjs --validate-only
          git --version
          docker version
          docker buildx version
          python3 --version
      - name: Acquire verified source, build a new core and compare identity
        timeout-minutes: 170
        shell: bash
        run: |
          set -euo pipefail
          node docs/codec-build/rebuild-probe.mjs "$RUNNER_TEMP/filecompresser-codec-probe"
      - name: Verify complete retention package and total storage budget
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          import { lstatSync, readFileSync, readdirSync } from 'node:fs'
          import path from 'node:path'
          const root = path.join(process.env.RUNNER_TEMP, 'filecompresser-codec-probe')
          const status = JSON.parse(readFileSync(path.join(root, 'diagnostics/probe-status.json'), 'utf8'))
          if (status.status !== 'probe-complete-not-released' || !status.sourceCollected || !status.built || status.legalClearance !== false || status.deployed !== false || !status.artifact?.completeSourceAccompaniesNewBinary) throw Error('Probe did not produce a complete source-accompanied result.')
          const bundle = path.join(root, 'codec-source-and-new-core.tar.gz')
          const bytes = readFileSync(bundle)
          if (!lstatSync(bundle).isFile() || bytes.length !== status.artifact.bytes || createHash('sha256').update(bytes).digest('hex') !== status.artifact.sha256) throw Error('Complete bundle identity changed.')
          let total = bytes.length
          for (const name of readdirSync(path.join(root, 'diagnostics'))) {
            if (!/^[a-z-]+\.json$/.test(name)) throw Error('Unexpected diagnostic artifact.')
            const file = path.join(root, 'diagnostics', name)
            const info = lstatSync(file)
            if (!info.isFile() || info.isSymbolicLink() || info.size > 1024 * 1024) throw Error('Unsafe diagnostic artifact.')
            JSON.parse(readFileSync(file, 'utf8'))
            total += info.size
          }
          if (total > 199 * 1024 * 1024) throw Error('Artifact inputs exceed the reserved total storage budget.')
          const entries = execFileSync('tar', ['-tzf', bundle], { encoding: 'utf8', maxBuffer: 4 * 1024 * 1024 }).split('\n')
          const includes = name => entries.includes(`./${name}`)
          if (!includes('newly-built-core/esm/ffmpeg-core.wasm') || !includes('newly-built-core/esm/ffmpeg-core.js') || !includes('recipe/Dockerfile.original') || !includes('recipe/Dockerfile.controlled') || !includes('recipe/rebuild-probe.mjs') || !includes('source-pins.json') || !includes('collection.json')) throw Error('Missing binary, source manifest or recipe in retention bundle.')
          const manifest = JSON.parse(readFileSync('docs/codec-build/source-pins.json', 'utf8'))
          for (const source of manifest.sources) {
            if (!includes(`source-archives/${source.name}-${source.commit}.tar.gz`)) throw Error(`Missing source archive: ${source.name}`)
            for (const file of source.licenseFiles) if (!includes(`notices/${source.name}/${file.path}`)) throw Error(`Missing notice: ${source.name}/${file.path}`)
          }
          console.log(`Complete source-plus-new-core retention inputs: ${total} bytes; one-day retention. Website/deployment/legal-clearance status remains false.`)
          NODE
      - name: Retain complete source with the newly built core for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codec-source-and-new-core-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/filecompresser-codec-probe/codec-source-and-new-core.tar.gz
            ${{ runner.temp }}/filecompresser-codec-probe/diagnostics/*.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain small diagnostics only if the probe fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codec-probe-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/filecompresser-codec-probe/diagnostics/*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Record the exact scope of this probe
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'Codec investigation only: pinned source acquisition, a newly compiled single-thread engine and hash comparison. No old installed codec binary is retained. Complete source and notices accompany any retained new binary. Main, the integration branch, DNS, website hosting and CMS accounts are not changed. No legal-clearance or production-readiness claim is made.' >> "$GITHUB_STEP_SUMMARY"

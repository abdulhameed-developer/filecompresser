name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://filecompresser.com
      NEXT_PUBLIC_ENABLE_INDEXING: 'false'
      NEXT_PUBLIC_TINA_CLIENT_ID: e80a2716-65ae-4124-a250-85a481310f9a
      NEXT_PUBLIC_TINA_BRANCH: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/check-source-secrets.mjs
      - run: npm run audit:dependencies -- --output-dir "${{ runner.temp }}/filecompresser-dependency-audit"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build the local CMS schema and non-indexable static site
        run: npm run build:cms:local
        env:
          NEXT_PUBLIC_SITE_URL: https://filecompresser.com
          NEXT_PUBLIC_ENABLE_INDEXING: 'false'
          CMS_SECURITY_EVIDENCE_FILE: ${{ runner.temp }}/filecompresser-dependency-audit/cms-admin-static-proof.json
      - run: npm run typecheck
      - run: npm run check:public
      - run: node scripts/check-export.mjs
      - run: node scripts/package-site.mjs
      - name: Retain raw dependency reports and verified disposition
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/filecompresser-dependency-audit/*.json
          if-no-files-found: warn
          retention-days: 7
      # Build artifacts remain on the runner; this workflow cannot publish.
# Production is built by Cloudflare Pages using npm run deploy:check.
# Its GitHub integration deploys pushes to main; no server or DEPLOY_COMMAND.

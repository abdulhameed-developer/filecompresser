name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://filecompresser.com
      NEXT_PUBLIC_ENABLE_INDEXING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - name: Build the local CMS schema and non-indexable static site
        run: npm run build:cms:local
        env:
          NEXT_PUBLIC_SITE_URL: https://filecompresser.com
          NEXT_PUBLIC_ENABLE_INDEXING: 'false'
      - run: npm run check:public
      - run: node scripts/check-export.mjs
      - run: node scripts/package-site.mjs
      # Build artifacts include GPL-enabled codec binaries. Keep them on the
      # runner until the documented source/notices release gate is resolved.
# Production is built by Cloudflare Pages using npm run build:cms.
# Its GitHub integration deploys pushes to main; no server or DEPLOY_COMMAND.
